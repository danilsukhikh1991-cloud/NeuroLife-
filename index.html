    <style>
        /* =========================================
           1. ПЕРЕМЕННЫЕ И БАЗОВЫЕ НАСТРОЙКИ
           ========================================= */
        :root {
            --gold: #d4af37;
            --gold-light: #f0d97a;
            --gold-dark: #8a6d1f;
            --gold-grad: linear-gradient(135deg, #8a6d1f, #d4af37 45%, #f5e39a 60%, #c9a227);
            --bg: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.7);
            --text: #f3edda;
            --text-muted: #9d94ab;
            --border: rgba(212, 175, 55, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-gold: 0 0 20px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        [data-theme="light"] {
            --bg: #f8f5f0;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text: #1a1510;
            --text-muted: #6d6357;
            --border: rgba(154, 123, 35, 0.25);
            --shadow: 0 8px 32px rgba(120, 90, 20, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
            background-image: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
        }

        /* =========================================
           2. КОМПОНЕНТЫ ИНТЕРФЕЙСА
           ========================================= */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: 99px; font-weight: 600; font-size: 15px;
            border: none; cursor: pointer; transition: all 0.3s ease; text-decoration: none;
        }
        .btn-gold {
            background: var(--gold-grad); color: #0a0a0f;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5); }
        .btn-outline {
            background: transparent; color: var(--gold); border: 1.5px solid var(--gold);
        }
        .btn-outline:hover { background: rgba(212, 175, 55, 0.1); }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: var(--shadow-gold);
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section-subtitle {
            text-align: center; color: var(--text-muted); max-width: 700px;
            margin: 0 auto 48px; font-size: 16px;
        }

        /* =========================================
           3. НАВИГАЦИЯ
           ========================================= */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        [data-theme="light"] header { background: rgba(248, 245, 240, 0.85); }
        
        .nav-inner {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 1200px; margin: 0 auto; padding: 16px 20px;
        }
        .logo {
            font-family: var(--font-serif); font-size: 24px; font-weight: 700;
            display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none;
        }
        .logo i { color: var(--gold); font-size: 28px; }
        
        .nav-links { display: flex; gap: 24px; }
        .nav-links a {
            color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500;
            transition: color 0.3s; position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .nav-links a.active::after {
            content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px;
            background: var(--gold-grad); border-radius: 2px;
        }

        .nav-actions { display: flex; gap: 12px; align-items: center; }
        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--gold); cursor: pointer;
            display: grid; place-items: center; transition: 0.3s;
        }
        .theme-toggle:hover { border-color: var(--gold); box-shadow: var(--shadow-gold); }

        /* =========================================
           4. СЕКЦИИ (SPA Роутинг)
           ========================================= */
        .view { display: none; animation: fadeIn 0.5s ease; padding: 60px 0; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Hero Section */
        .hero {
            text-align: center; padding: 100px 0 80px;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
        }
        .hero h1 {
            font-family: var(--font-serif); font-size: clamp(36px, 6vw, 64px);
            font-weight: 700; line-height: 1.1; margin-bottom: 24px;
        }
        .hero p { font-size: 18px; color: var(--text-muted); max-width: 600px; margin: 0 auto 40px; }
        .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

        /* Grid layouts */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .form-input {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: rgba(255,255,255,0.03);
            color: var(--text); font-family: var(--font-main); font-size: 15px;
            transition: all 0.3s;
        }
        .form-input:focus { outline: none; border-color: var(--gold); box-shadow: var(--shadow-gold); }

        /* =========================================
           5. МОДАЛЬНЫЕ ОКНА
           ========================================= */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
            max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;
            padding: 32px; position: relative; animation: modalPop 0.3s ease;
        }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close {
            position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
            border-radius: 50%; border: 1px solid var(--border); background: transparent;
            color: var(--text); cursor: pointer; display: grid; place-items: center;
        }
        .modal-close:hover { border-color: var(--gold); color: var(--gold); }

        .login-option {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px;
            border-radius: 12px; border: 1px solid var(--border); background: transparent;
            color: var(--text); font-size: 15px; cursor: pointer; transition: 0.3s; margin-bottom: 12px;
        }
        .login-option:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .login-option i { font-size: 20px; width: 24px; text-align: center; }
        .login-option.vk i { color: #0077FF; }
        .login-option.tg i { color: #24A1DE; }
        .login-option.max i { color: #FF5722; }
        .login-option.phone i { color: var(--gold); }

        /* =========================================
           6. АНИМАЦИИ И УТИЛИТЫ
           ========================================= */
        .glow-text { text-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .text-gold { color: var(--gold); }
        .mt-4 { margin-top: 32px; }
        
        /* Мобильная навигация */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-nav {
                display: flex; position: fixed; bottom: 0; left: 0; right: 0;
                background: var(--bg-card); backdrop-filter: blur(16px);
                border-top: 1px solid var(--border); z-index: 90;
                justify-content: space-around; padding: 12px 0 env(safe-area-inset-bottom);
            }
            .mobile-nav a {
                display: flex; flex-direction: column; align-items: center; gap: 4px;
                color: var(--text-muted); text-decoration: none; font-size: 11px;
            }
            .mobile-nav a.active { color: var(--gold); }
            .mobile-nav a i { font-size: 20px; }
            .view { padding-bottom: 80px; }
        }
        @media (min-width: 769px) { .mobile-nav { display: none; } }

        /* Loader для нумерологии */
        .loader {
            border: 3px solid rgba(212, 175, 55, 0.1); border-top: 3px solid var(--gold);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin: 20px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
   3. Нумерология и биоритмы (интерфейс готов к подключению API)

    6. Форма записи на приём с юридическими согласиями
    7. Мульти-вход (VK, TG, MAX, Телефон)
    -->
