<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Нейролайф — центр неврологии и психического здоровья в Кирове. Доказательная медицина, анонимность, 21 методика диагностики.">
    <title>Нейролайф | Центр неврологии и психического здоровья</title>
    
    <!-- Шрифт Inter для профессионального медицинского вида -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- VK Bridge для нативной интеграции -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        /* =========================================
           1. ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ (CSS)
           ========================================= */
        :root {
            --primary: #2563eb;       /* Спокойный медицинский синий */
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Поддержка тёмной темы VK */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #334155;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 80px; /* Отступ для нижней навигации */
        }

        /* =========================================
           2. КОМПОНЕНТЫ ИНТЕРФЕЙСА
           ========================================= */
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 100%; padding: 14px 20px; border-radius: var(--radius);
            font-weight: 600; font-size: 16px; border: none; cursor: pointer;
            transition: all 0.2s ease; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-success { background: var(--success); color: white; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .input {
            width: 100%; padding: 12px 16px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-size: 16px; outline: none; transition: border-color 0.2s;
        }
        .input:focus { border-color: var(--primary); }

        /* Скелетон загрузки (мигающий эффект) */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px; height: 20px; margin-bottom: 8px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Навигация */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 8px 0;
            z-index: 100; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 11px; color: var(--text-secondary); text-decoration: none; padding: 4px 12px;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }

        /* Секции (скрываются/показываются через JS) */
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Модальные окна для согласий */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; align-items: center; justify-content: center; padding: 16px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface); border-radius: var(--radius);
            padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .modal-text { font-size: 14px; color: var(--text-secondary); white-space: pre-line; margin-bottom: 20px; }

        /* Чекбоксы согласий */
        .consent-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 14px; }
        .consent-item input { margin-top: 3px; accent-color: var(--primary); width: 18px; height: 18px; }
        .consent-link { color: var(--primary); text-decoration: underline; cursor: pointer; }

        /* Уведомления (Toast) */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--surface); padding: 12px 24px;
            border-radius: 50px; font-size: 14px; font-weight: 500; z-index: 2000;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    an>
</head>
<body>

    <!-- Уведомления -->
    <div id="toast" class="toast">Сообщение</div>

    <div class="container">
        <!-- ШАПКА -->
        <header class="card" style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <h1 style="font-size: 20px; font-weight: 700; color: var(--primary);">Нейролайф</h1>
                <p style="font-size: 13px; color: var(--text-secondary);">Центр неврологии и психического здоровья</p>
            </div>
            <div id="user-avatar" style="width: 40px; height: 40px; background: var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-secondary);">
                ?
            </div>
        </header>

        <!-- СЕКЦИЯ: ГЛАВНАЯ -->
        <div id="section-home" class="section active">
            <div class="card" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none;">
                <h2 style="font-size: 22px; margin-bottom: 8px;">Добро пожаловать!</h2>
                <p style="opacity: 0.9; margin-bottom: 16px; font-size: 15px;">Анонимно, без очередей и постановки на учёт. Индивидуальный подход и современные протоколы.</p>
                <button class="btn" style="background: white; color: var(--primary);" onclick="showSection('booking'); triggerHaptic();">📅 Записаться на приём</button>
            </div>

            <h3 style="font-size: 18px; font-weight: 600; margin: 24px 0 12px;">Почему выбирают нас</h3>
            <div style="display: grid; gap: 12px;">
                <div class="card" style="padding: 16px; display: flex; gap: 12px; align-items: center;">
                    <span style="font-size: 24px;">🛡️</span>
                    <div>
                        <div style="font-weight: 600;">Полная анонимность</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">Без постановки на учёт, строгая врачебная тайна</div>
                    </div>
                </div>
                <div class="card" style="padding: 16px; display: flex; gap: 12px; align-items: center;">
                    <span style="font-size: 24px;">🔬</span>
                    <div>
                        <div style="font-weight: 600;">Доказательная медицина</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">Международные протоколы, DSM-5, МКБ-11</div>
                    </div>
                </div>
                <div class="card" style="padding: 16px; display: flex; gap: 12px; align-items: center;">
                    <span style="font-size: 24px;">👨‍⚕️</span>
                    <div>
                        <div style="font-weight: 600;">Опыт 12+ лет</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">Сухих Данил Витальевич, врач-психиатр, психотерапевт</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- СЕКЦИЯ: КАРТА ПУТИ (ПРОФИЛЬ) -->
        <div id="section-profile" class="section">
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">🗺️ Карта пути</h2>
            
            <div id="profile-loading">
                <div class="skeleton" style="height: 80px;"></div>
                <div class="skeleton" style="height: 120px;"></div>
            </div>

            <div id="profile-content" style="display: none;">
                <div class="card">
                    <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">📊 Ваша статистика</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center;">
                        <div style="background: var(--bg); padding: 12px; border-radius: 8px;">
                            <div style="font-size: 24px; font-weight: 700; color: var(--primary);" id="stat-tests">0</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">Тестов пройдено</div>
                        </div>
                        <div style="background: var(--bg); padding: 12px; border-radius: 8px;">
                            <div style="font-size: 24px; font-weight: 700; color: var(--primary);" id="stat-lila">Не начата</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">Игра Лила</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">🔢 Нумерология и Арканы</h3>
                    <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">Матрица Пифагора и биоритмы рассчитываются на основе вашей даты рождения.</p>
                    <button class="btn btn-secondary" onclick="showToast('Раздел в разработке'); triggerHaptic();">Рассчитать профиль</button>
                </div>
            each>
        </div>

        <!-- СЕКЦИЯ: ЗАПИСЬ НА ПРИЁМ -->
        <div id="section-booking" class="section">
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">📅 Запись на приём</h2>
            
            <form id="booking-form" onsubmit="handleBooking(event)">
                <div class="card">
                    <div class="input-group">
                        <label>Ваше имя *</label>
                        <input type="text" name="name" class="input" required placeholder="Иван Иванов">
                    </div>
                    <div class="input-group">
                        <label>Телефон *</label>
                        <input type="tel" name="phone" class="input" required placeholder="+7 (999) 000-00-00">
                    </div>
                    <div class="input-group">
                        <label>Специалист *</label>
                        <select name="specialist" class="input" required>
                            <option value="Психиатр">🧠 Психиатр</option>
                            <option value="Психотерапевт">💬 Психотерапевт</option>
                            <option value="Невролог">⚕️ Невролог</option>
                            <option value="Клинический психолог">🧩 Клинический психолог</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Желаемая дата и время *</label>
                        <input type="datetime-local" name="datetime" class="input" required>
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">Согласия (обязательно)</h3>
                    
                    <label class="consent-item">
                        <input type="checkbox" required>
                        <span>Я даю <span class="consent-link" onclick="openModal('modal-152')">согласие на обработку персональных данных</span> (152-ФЗ).</span>
                    </label>
                    <label class="consent-item">
                        <input type="checkbox" required>
                        <span>Я даю <span class="consent-link" onclick="openModal('modal-med')">информированное добровольное согласие</span> на медицинское вмешательство.</span>
                    </label>
                    <label class="consent-item">
                        <input type="checkbox">
                        <span>Я <span class="consent-link" onclick="openModal('modal-egis')">отказываюсь от передачи данных в ЕГИСЗ</span>.</span>
                    </label>
                    <label class="consent-item">
                        <input type="checkbox" required>
                        <span>Подтверждаю, что мне есть 18 лет (или действую с согласия родителей).</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="booking-btn">Отправить заявку</button>
                <p style="text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 12px;">
                    Нажимая кнопку, вы соглашаетесь с <span class="consent-link" onclick="openModal('modal-policy')">Политикой конфиденциальности</span>.
                </p>
            </form>
        </div>

        <!-- СЕКЦИЯ: ТЕСТЫ (Заглушка для демонстрации) -->
        <div id="section-tests" class="section">
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">📊 Диагностика</h2>
            <div class="card">
                <p style="margin-bottom: 16px; color: var(--text-secondary);">21 клиническая и личностная методика. Мгновенная интерпретация с рекомендациями.</p>
                <button class="btn btn-secondary" style="margin-bottom: 8px;" onclick="showToast('Переход к BDI-II...'); triggerHaptic();">📋 Шкала депрессии Бека (BDI-II)</button>
                <button class="btn btn-secondary" style="margin-bottom: 8px;" onclick="showToast('Переход к BAI...'); triggerHaptic();">😰 Шкала тревоги Бека (BAI)</button>
                <button class="btn btn-secondary" onclick="showToast('Переход к HADS...'); triggerHaptic();">🏥 Госпитальная шкала (HADS)</button>
            </div>
        </div>

    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="showSection('home'); triggerHaptic(); return false;">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-item" onclick="showSection('profile'); triggerHaptic(); return false;">
            <span class="nav-icon">🗺️</span>
            <span>Путь</span>
        </a>
        <a href="#" class="nav-item" onclick="showSection('tests'); triggerHaptic(); return false;">
            <span class="nav-icon">📊</span>
            <span>Тесты</span>
        </a>
        <a href="#" class="nav-item" onclick="showSection('booking'); triggerHaptic(); return false;">
            <span class="nav-icon">📅</span>
            <span>Запись</span>
        </a>
    </nav>

    <!-- МОДАЛЬНЫЕ ОКНА С ТЕКСТАМИ СОГЛАСИЙ -->
    <div id="modal-152" class="modal" onclick="closeModal('modal-152', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">Согласие на обработку персональных данных</div>
            <div class="modal-text">Я, действуя свободно, своей волей и в своем интересе, в соответствии со статьей 9 Федерального закона от 27 июля 2006 г. № 152-ФЗ «О персональных данных», даю своё согласие ООО «ДМЦ «Здоровые дети» (ОГРН 1164350067980, ИНН 4345448601), осуществляющему деятельность под брендом «Нейролайф», на обработку моих персональных данных: ФИО, дата рождения, контакты, сведения о состоянии здоровья. Цели: оказание медицинской помощи, ведение документации. Срок действия: 5 лет или до отзыва.</div>
            <button class="btn btn-primary" onclick="closeModal('modal-152')">Понятно</button>
        </div>
    </div>

    <div id="modal-med" class="modal" onclick="closeModal('modal-med', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">Информированное добровольное согласие</div>
            <div class="modal-text">Я даю информированное добровольное согласие на медицинские вмешательства (осмотр, консультации, психотерапевтическая беседа, тестирование) в ООО «ДМЦ «Здоровые дети». Мне разъяснены цели, методы, риски и возможные последствия. Я имею право отказаться от вмешательства.</div>
            <button class="btn btn-primary" onclick="closeModal('modal-med')">Понятно</button>
        </div>
    </div>

    <div id="modal-egis" class="modal" onclick="closeModal('modal-egis', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">Отказ от передачи данных в ЕГИСЗ</div>
            <div class="modal-text">В соответствии со ст. 13 ФЗ № 323-ФЗ и ст. 9 ФЗ № 152-ФЗ, я заявляю о своём отказе от предоставления согласия на передачу в Единую государственную информационную систему в сфере здравоохранения (ЕГИСЗ) сведений о факте обращения, состоянии здоровья и диагнозе.</div>
            <button class="btn btn-primary" onclick="closeModal('modal-egis')">Понятно</button>
        </div>
    </div>

    <!-- JAVASCRIPT ЛОГИКА -->
    <script>
        // ==========================================
        // 1. КОНФИГУРАЦИЯ (ИЗМЕНИТЕ URL НА ВАШ AMVERA)
        // ==========================================
        const CONFIG = {
            // Вставьте сюда реальный адрес вашего бота на Amvera
            API_BASE: 'https://neurolife-bot-danil2402.amvera.io', 
            VK_APP_ID: 51425804 // Замените на реальный ID вашего VK приложения
        };

        let vkUserId = null;

        // ==========================================
        // 2. ИНИЦИАЛИЗАЦИЯ VK BRIDGE
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Инициализация VK Mini App
                await vkBridge.send('VKWebAppInit');
                showToast('Приложение загружено');
                
                // Запрашиваем данные пользователя для автоавторизации
                const userInfo = await vkBridge.send('VKWebAppGetUserInfo');
                if (userInfo && userInfo.id) {
                    vkUserId = userInfo.id;
                    document.getElementById('user-avatar').textContent = userInfo.first_name ? userInfo.first_name[0] : 'U';
                    
                    // Загружаем профиль с вашего бэкенда
                    loadUserProfile(vkUserId);
                }
            } catch (error) {
                console.warn('VK Bridge не доступен (возможно, открыто в обычном браузере):', error);
                // Fallback для тестирования в обычном браузере
                document.getElementById('user-avatar').textContent = 'Г';
            }
        });

        // ==========================================
        // 3. НАВИГАЦИЯ И UX
        // ==========================================
        function showSection(sectionId) {
            // Скрываем все секции
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            // Показываем нужную
            document.getElementById(`section-${sectionId}`).classList.add('active');
            
            // Подсвечиваем кнопку в навигации
            const navLinks = document.querySelectorAll('.nav-item');
            const sectionMap = { 'home': 0, 'profile': 1, 'tests': 2, 'booking': 3 };
            if (sectionMap[sectionId] !== undefined) {
                navLinks[sectionMap[sectionId]].classList.add('active');
            }
            
            // Прокрутка вверх
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function triggerHaptic() {
            // Тактильный отклик для мобильных устройств (вибрация)
            if (window.vkBridge) {
                vkBridge.send('VKWebAppTapticNotificationOccurred', { type: 'success' }).catch(() => {});
            } else if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==========================================
        // 4. РАБОТА С API (СВЯЗЬ С AMVERA)
        // ==========================================
        async function loadUserProfile(userId) {
            try {
                // Имитация загрузки (показываем скелетон)
                document.getElementById('profile-loading').style.display = 'block';
                document.getElementById('profile-content').style.display = 'none';

                // Реальный запрос к вашему бэкенду
                // const response = await fetch(`${CONFIG.API_BASE}/api/profile?user_id=${userId}`);
                // const data = await response.json();
                
                // ЗАГЛУШКА ДЛЯ ДЕМОНСТРАЦИИ (удалите этот блок setTimeout при подключении реального API)
                await new Promise(r => setTimeout(r, 800)); 
                const data = { status: 'ok', profile: { tests_count: 3, lila_active: true } };
                // КОНЕЦ ЗАГЛУШКИ

                if (data.status === 'ok' && data.profile) {
                    document.getElementById('stat-tests').textContent = data.profile.tests_count || 0;
                    document.getElementById('stat-lila').textContent = data.profile.lila_active ? 'Активна' : 'Не начата';
                }
            } catch (error) {
                console.error('Ошибка загрузки профиля:', error);
                showToast('Не удалось загрузить данные');
            } finally {
                document.getElementById('profile-loading').style.display = 'none';
                document.getElementById('profile-content').style.display = 'block';
            }
        }

        function openModal(id) {
            triggerHaptic();
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id, event) {
            // Закрываем, если кликнули по фону или по кнопке
            if (!event || event.target.id === id || event.target.tagName === 'BUTTON') {
                document.getElementById(id).classList.remove('active');
            }
